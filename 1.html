<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>THE ZOO </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
       <h1>
        my zoo </h1>
        <p> This is my zoo <p>
            <div id="zoo">
                <div class="zone">Zone 1: <span id="zone1"></span></div>
                <div class="zone">Zone 2: <span id="zone2"></span></div>
                <div class="zone">Zone 3: <span id="zone3"></span></div>
                <div class="zone">Total <span id="total"></span></div>
                
            </div>
            <button onclick="openZoo()">Open Zoo !</button>
            <p id="zoo-status"></p>
            <script>
                function openZoo(){
                    document.getElementById("zone1").innerHTML = "LION";
                    document.getElementById("zone2").innerHTML = "TIGER";
                    document.getElementById("zone3").innerHTML = "BEAR";
                    document.getElementById("total").innerHTML= "3";
                    document.getElementById("zoo").style.backgroundColor = "lightgreen";
                    document.getElementById("zoo-status").innerHTML= document.title + "is not open";


                }
                </script>
    </body>
</html>

    <body>
        <ul> 
            <li> Reverse of array <span id="reversing"></span></li>
            <li> Maping <span id="mapping"></span></li>
            <li> aesanding order <span id="aescendingorder"></span></li>
        </ul>
        <script>
            var languages = ["C++", "Java", "Python", "JavaScript"];
            document.getElementById("reversing").innerHTML = languages.reverse();
            document.getElementById("sorting").innerHTML = languages.sort();
            var mappingofarray = languages.map( function (c){
                return c + "pro";
            })
            document.getElementById("mapping").innerHTML = mappingofarray;
            var aescendingorder = languages.sort( function (a,b){
                return a-b;
            })
           document.getElementById("aescendingorder").innerHTML = aescendingorder;
           
               
            
        </script>

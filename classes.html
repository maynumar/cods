    <body>
        <p> Lets look <span id="cardesign"> </span> </p>
        <script>
            class car {
                constructor (name, year ){
                    this.name = name;
                    this.year = year;
                }
                models () {
                    return this.name + " was designed in " + this.year;
                }
            }
            let car1 = new car("BMW", 1999);
            document.write(car1.models());
            let car2 = new car("Audi", 2020);
            document.write("<br>" + car2.models());
            document.getElementById("cardesign").innerHTML = "car" + car1.models() + "<br>" + car2.models();
        </script>
    </body>
